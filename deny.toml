# cargo deny check : failles connues (base RustSec), licences et provenance des dépendances.
# Lancé par la CI (.github/workflows/ci.yml) ; en local : cargo install cargo-deny && cargo deny check

[graph]
all-features = true

[advisories]
# Une faille connue ou une dépendance retirée de crates.io bloque la CI.
yanked = "deny"
ignore = [
    # paste : macro abandonnée par son auteur, sans faille connue ; tirée par les décodeurs EXR et
    # AVIF de la bibliothèque image, dont Printr ne se sert pas.
    { id = "RUSTSEC-2024-0436", reason = "abandonnée, sans faille ; via image (EXR, AVIF)" },
]

[licenses]
# Licences compatibles avec Apache 2.0, la licence de Printr.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Plusieurs versions d'une même dépendance : signalé, sans bloquer.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# CrossWords, dépendance git du même auteur.
allow-git = ["https://github.com/XNinety9/CrossWords"]
