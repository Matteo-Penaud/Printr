# Mises à jour des dépendances : une PR groupée par semaine et par écosystème, vérifiée par la CI.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Dépendances"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions"
